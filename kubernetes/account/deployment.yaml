apiVersion: apps/v1
kind: Deployment

metadata:
  name: account-service
  namespace: cloudbank

  labels:
    app: account-service
    tier: backend

spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: account-service

  template:
    metadata:
      labels:
        app: account-service
        tier: backend

    spec:
      containers:

      - name: account-service

        image: shobha722/cloudbank-acctsvc:v2

        imagePullPolicy: Always

        ports:
        - containerPort: 5001

        envFrom:
        - configMapRef:
            name: cloudbank-config

        - secretRef:
            name: cloudbank-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 5001

          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 5001

          initialDelaySeconds: 15
          periodSeconds: 5

apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: cloudbank

  labels:
    app: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:

      - name: postgres

        image: postgres:16

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5432
        
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata


        envFrom:
        - secretRef:
            name: postgres-secret

        - configMapRef:
            name: postgres-config
        

        volumeMounts:

        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: postgres-init-script
          mountPath: /docker-entrypoint-initdb.d

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"

          limits:
            cpu: "1000m"
            memory: "1Gi"

      volumes:

      - name: postgres-storage

        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init-script
        configMap:
          name: postgres-init-script

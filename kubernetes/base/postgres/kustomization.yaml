apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres-configmap.yaml
  - postgres-secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: postgres-init-script
    files:
      - init.sql

generatorOptions:
  disableNameSuffixHash: true
